name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Trust kernel (lint, AI-free guard, tests, attack suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,qiskit]"
      - name: Lint
        run: ruff check .
      - name: "Guard: no AI/ML in the trust path (NFR-1)"
        run: lint-imports
      - name: SAST (bandit)
        run: bandit -q -r qsentinel -ll
      - name: SAST (semgrep)
        run: pip install semgrep && semgrep scan --config p/python --error --quiet qsentinel
        continue-on-error: true   # advisory until the first clean baseline is triaged
      - name: "Bound validation: simulator vs exact formula (D5, within 10%)"
        run: python -m qsentinel.detect.validate --n 16 --blocks 40000
      - name: Tests
        run: pytest --cov=qsentinel --cov-report=term-missing
      - name: Attack suite (every attack must be detected)
        run: python -m qsentinel.attacks.run qsentinel/attacks/campaigns/smoke.yaml
      - name: Dependency audit
        run: pip-audit
        continue-on-error: true

  web:
    name: SOC dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
