# One-command demo (NFR-14):  docker compose up --build
#   API + docs:  http://localhost:8000/docs
#   Dashboard:   http://localhost:5173
services:
  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    environment:
      QSENTINEL_PROFILE: fast          # fast (L=32, n=64) | full (L=256, n=256)
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args: { VITE_API_URL: http://localhost:8000 }
    ports: ["5173:80"]
    depends_on: [api]

  # Phase 3+ (uncomment when used):
  # redis:        # telemetry bus with read-only ACL for the ops plane
  #   image: redis:7-alpine
