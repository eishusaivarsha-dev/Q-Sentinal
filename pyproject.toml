[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsentinel"
version = "0.1.0"
description = "Q-SENTINEL: AI-free, quantum-inspired threat detection for teleportation-based Quantum Digital Signatures"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# NOTE: the trust kernel must never depend on an ML library.
# ML lives in the separate ops/ package (qsentinel_ops).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "stim>=1.13",
    "pyyaml>=6.0",
    "dilithium-py>=1.1",        # pure-Python ML-DSA (dev); liboqs-python used if installed
    "kyber-py>=1.0",            # pure-Python ML-KEM (dev); liboqs-python used if installed
    "cryptography>=42",         # X25519, HKDF-SHA3, ChaCha20-Poly1305
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
qiskit = ["qiskit>=2.0", "qiskit-aer>=0.15"]
ibm = ["qiskit>=2.0", "qiskit-ibm-runtime>=0.30"]
noise = ["qutip>=5.0"]
pqc = ["liboqs-python>=0.10"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "import-linter>=2.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["qsentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# ChannelModel is a frozen dataclass; FastAPI dependency markers are meant to be defaults.
extend-immutable-calls = [
    "qsentinel.quantum.ChannelModel", "qsentinel.quantum.backend.ChannelModel",
    "fastapi.Depends", "fastapi.Header", "fastapi.Query", "qsentinel.api.main.require",
]

# ---------------------------------------------------------------------------
# Architectural guard: NO AI/ML IN THE TRUST PATH (NFR-1)
# Run with:  lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["qsentinel"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Trust kernel (quantum, qds, detect) must not import any ML library or the ops plane"
type = "forbidden"
source_modules = ["qsentinel.quantum", "qsentinel.qds", "qsentinel.detect"]
forbidden_modules = ["sklearn", "torch", "tensorflow", "keras", "xgboost", "lightgbm", "prophet", "optuna", "transformers", "anthropic", "openai", "qsentinel_ops"]

[[tool.importlinter.contracts]]
name = "Trust kernel must not depend on API, attacks or UI layers"
type = "forbidden"
source_modules = ["qsentinel.quantum", "qsentinel.qds", "qsentinel.detect"]
forbidden_modules = ["qsentinel.api", "qsentinel.attacks"]
