# Serves the single-page dashboard. Unknown paths (e.g. /verdicts/42 after a refresh) fall back to
# index.html so the React router can handle them. Hashed assets are cached for a year.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
